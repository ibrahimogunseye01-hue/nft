<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <style type="text/tailwindcss">
      @theme {
        --color-Blue500:hsl(215, 51%, 70%);
        --color-Cyan400:hsl(178, 100%, 50%);
         --color-Blue950: hsl(217, 54%, 11%);
         --color-Bluem900: hsl(216, 50%, 16%);
        --color-Bluebell800: hsl(215, 32%, 27%);
         --color-White: hsl(0, 0%, 100%);
      -- font-family:  "Outfit", sans-serif;
      }
    </style>
  </head>
  <body class="bg-Bluem900 py-15 px-5 flex items-center justify-center lg:w-full ">
    <div class="bg-Bluebell800 p-6 rounded-[12px] lg:w-[50%]">
      <div class="relative group">
        <img class="rounded-[12px] w-full object fit" src="./images/image-equilibrium.jpg" alt="" />

        <div class="absolute top-0 w-full h-full flex items-center justify-center group-hover:bg-Cyan400/60 opacity-0 hover:opacity-80 rounded-[12px]">
        <img src="./images/icon-view.svg" alt="">
        </div>
      </div>
      <div class="flex flex-col gap-3 pt-4">
        <h1 class="text-white  align-center font-Outfit hover:text-Cyan400">Equilibrium#3429</h1>
        <p class="text-Blue500">Our Equilibrium collection promotes balance and calm</p>
       <div class="flex justify-between">
            <div class="flex gap-2">
          <img src="./images/icon-ethereum.svg" alt="" />
          <p class="text-Cyan400">0.041ETH</p>
        </div>
        <div class="flex gap-3">
          <img src="./images/icon-clock.svg" alt="" />
          <p class="text-Blue500">3daysleft</p>
        </div>

       </div>
        <hr />
        <div class="flex gap-2">
          <img class="border rounded-[20px] border-white w-[38px]" src="./images/image-avatar.png" alt="" />
          <p class="lg:text-white"><span class="text-Blue500">creation of  </span> <span class="hover:text-Cyan400">jules wyvern</span> </p>
        </div>
      </div>
    </div>
  </body>
</html>
